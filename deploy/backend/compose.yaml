name: field-shift-api

services:
  api:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the release image digest}
    restart: unless-stopped
    init: true
    env_file: ./backend.env
    environment:
      CACHE_DIR: /var/lib/field-shift
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - atlas-cache:/var/lib/field-shift
      - /opt/field-shift/data/power:/app/data/power
      - /opt/field-shift/data/soilgrids:/app/data/soilgrids
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1200m
    mem_reservation: 900m
    memswap_limit: 1456m
    cpus: 1.5
    pids_limit: 128
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3))['status'] == 'ok'"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  atlas-cache:
